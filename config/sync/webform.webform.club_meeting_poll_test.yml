id: club_meeting_poll_test
title: 'Site Poll'
description: '<p>Help us understand what members would like from the club and their current backgammon experience.</p>'
categories: {  }
elements: |-
  markup:
    '#type': webform_markup
    '#markup': '<p>Please take time to complete the poll on this page to give us an idea of what everyone expects from the club and your experience level..</p>'
  how_often_to_meet:
    '#type': webform_radios_other
    '#title': 'How often should we meet?'
    '#options':
      'Once a Week': 'Once a Week'
      'Twice a Month': 'Twice a Month'
      'Once a Month': 'Once a Month'
    '#other__placeholder': 'Enter other...'
    '#required': true
  where_to_meet:
    '#type': webform_radios_other
    '#title': 'Where should we meet?'
    '#options':
      'Local Pub': 'Local Pub'
      'Hire a Venue': 'Hire a Venue'
    '#other__placeholder': 'Enter other...'
    '#required': true
  how_do_you_want_to_play:
    '#type': radios
    '#title': 'How would you like to play?'
    '#options':
      'Friendly Games': 'Friendly Games'
      League: League
      Knockouts: Knockouts
      'League & Knockouts': 'League & Knockouts'
      'All three': 'All three'
    '#required': true
  what_s_your_skill_level:
    '#type': radios
    '#title': "What's your skill level?"
    '#options':
      'New to Backgammon': 'New to Backgammon'
      Intermediate: Intermediate
      Advanced: Advanced
    '#required': true
  do_you_play_online:
    '#type': radios
    '#title': 'Do you play backgammon online?'
    '#options':
      'Yes': 'Yes'
      'No': 'No'
  do_you_use_the_doubling_cube:
    '#type': radios
    '#title': 'Do you use the doubling cube?'
    '#options':
      'Yes': 'Yes'
      'No': 'No'
      "Don't know what that is": "Don't know what that is"
    '#required': true
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Submit Response'
