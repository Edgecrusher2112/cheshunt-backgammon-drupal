<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cheshunt Backgammon logo mark</title>
  <desc id="desc">A circular navy, ivory and red emblem featuring backgammon points, two checkers and two dice.</desc>

  <defs>
    <clipPath id="board-clip">
      <circle cx="256" cy="256" r="214"/>
    </clipPath>
  </defs>

  <!-- Circular board -->
  <circle cx="256" cy="256" r="238" fill="#111118"/>
  <circle cx="256" cy="256" r="214" fill="#f0f0ff"/>
  <circle cx="256" cy="256" r="199" fill="#111118"/>

  <!-- Backgammon points -->
  <g clip-path="url(#board-clip)">
    <path d="M78 116 L137 80 L150 324 Z" fill="#f0f0ff"/>
    <path d="M144 74 L202 52 L190 324 Z" fill="#ff2d78"/>
    <path d="M210 48 L256 39 L256 324 Z" fill="#f0f0ff"/>
    <path d="M265 41 L310 52 L294 324 Z" fill="#ff2d78"/>
    <path d="M321 55 L379 82 L332 324 Z" fill="#f0f0ff"/>
    <path d="M386 87 L431 128 L365 324 Z" fill="#f0f0ff"/>
  </g>

  <!-- Ivory checker -->
  <circle cx="157" cy="342" r="74" fill="#f0f0ff" stroke="#111118" stroke-width="12"/>

  <!-- Rear die -->
  <g transform="translate(325 267) rotate(7 49 49)">
    <rect width="98" height="98" rx="13" fill="#f0f0ff" stroke="#111118" stroke-width="10"/>
    <g fill="#111118">
      <circle cx="25" cy="25" r="6"/>
      <circle cx="73" cy="25" r="6"/>
      <circle cx="49" cy="49" r="6"/>
      <circle cx="25" cy="73" r="6"/>
      <circle cx="73" cy="73" r="6"/>
    </g>
  </g>

  <!-- Front die -->
  <g transform="translate(292 337) rotate(-8 51 51)">
    <rect width="102" height="102" rx="13" fill="#f0f0ff" stroke="#111118" stroke-width="10"/>
    <g fill="#111118">
      <circle cx="27" cy="27" r="6"/>
      <circle cx="75" cy="27" r="6"/>
      <circle cx="27" cy="75" r="6"/>
      <circle cx="75" cy="75" r="6"/>
    </g>
  </g>

  <!-- Red checker -->
  <circle cx="230" cy="392" r="79" fill="#ff2d78" stroke="#111118" stroke-width="12"/>
</svg>
